<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD521" />
      <stop offset="30%" stop-color="#F56040" />
      <stop offset="65%" stop-color="#E1306C" />
      <stop offset="100%" stop-color="#833AB4" />
    </linearGradient>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#dark-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#ig-grad)" stroke-width="6" opacity="0.6" />

  <!-- Crop frame corners -->
  <path d="M 120 180 L 120 120 L 180 120" stroke="url(#ig-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 392 180 L 392 120 L 332 120" stroke="url(#ig-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 120 332 L 120 392 L 180 392" stroke="url(#ig-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 392 332 L 392 392 L 332 392" stroke="url(#ig-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner camera / aperture glyph with gradient -->
  <rect x="176" y="176" width="160" height="160" rx="44" stroke="url(#ig-grad)" stroke-width="16" fill="none" />
  <circle cx="256" cy="256" r="42" stroke="url(#ig-grad)" stroke-width="14" fill="none" />
  <circle cx="304" cy="208" r="10" fill="url(#ig-grad)" />
</svg>